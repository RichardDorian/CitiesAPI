name: Rust Tests And Coverage

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests with coverage instrumentation
        run: |
          mkdir -p artifacts
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --workspace --lib --bins --no-report 2>&1 | tee artifacts/test-results.txt
          tar -czf artifacts/raw-coverage-data.tar.gz target/llvm-cov-target

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results.txt

      - name: Upload raw coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-coverage-data
          path: artifacts/raw-coverage-data.tar.gz

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Download raw coverage data
        uses: actions/download-artifact@v4
        with:
          name: raw-coverage-data
          path: artifacts

      - name: Restore raw coverage data
        run: tar -xzf artifacts/raw-coverage-data.tar.gz

      - name: Generate coverage reports (no test re-run)
        run: |
          mkdir -p coverage
          cargo llvm-cov report --workspace --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --workspace --summary-only | tee coverage/summary.txt

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            coverage/summary.txt
