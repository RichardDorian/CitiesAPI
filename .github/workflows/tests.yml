name: Rust Unit Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-18.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.94
          profile: minimal
          override: true

      - name: Test
        run: cargo test
