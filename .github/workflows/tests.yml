name: Rust Tests And Coverage

on:
  push:
  pull_request:

jobs:
  tests-and-coverage:
    name: Tests And Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests and build reports
        run: |
          mkdir -p artifacts coverage
          cargo llvm-cov clean --workspace

          set +e

          cargo llvm-cov test --workspace --no-report 2>&1 | tee artifacts/test-results.txt
          test_exit=${PIPESTATUS[0]}

          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          lcov_exit=$?

          cargo llvm-cov report --html --output-dir coverage/html
          html_exit=$?

          {
            echo "# Test Results"
            echo
            echo "Generated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '```text'
            cat artifacts/test-results.txt
            echo '```'
          } > artifacts/test-results.md

          set -e

          if [ "$test_exit" -ne 0 ]; then
            exit "$test_exit"
          fi

          if [ "$lcov_exit" -ne 0 ]; then
            exit "$lcov_exit"
          fi

          exit "$html_exit"

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            artifacts/test-results.txt
            artifacts/test-results.md
            coverage/lcov.info
            coverage/html
