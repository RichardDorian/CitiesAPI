name: Build

on:
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: write # Write access required to create the release
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  oci-image:
    name: Build and push OCI image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94

      - name: Build binary
        run: cargo build --release

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: citiesapi-x86_64-unknown-linux-gnu
          path: target/release/citiesapi

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - name: Retrieve compiled binaries
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            citiesapi-x86_64-unknown-linux-gnu
