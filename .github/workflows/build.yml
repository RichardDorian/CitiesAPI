name: Build app

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  build-amd64:
    name: Build amd64 image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi,push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/arm64
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi,push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-manifest:
    name: Merge multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        run: >-
          docker buildx imagetools create
          -t ${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi:${{ github.sha }}
          ${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi@${{ needs.build-amd64.outputs.digest }}
          ${{ env.CONTAINER_REGISTRY }}/richarddorian/citiesapi@${{ needs.build-arm64.outputs.digest }}
