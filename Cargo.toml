[package]
name = "citiesapi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.102"
axum = { version = "=0.8.9", features = ["http2", "tokio", "macros"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.0", features = ["full"] }
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
